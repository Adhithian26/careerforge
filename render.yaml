services:
  # 1. CareerForge AI - FastAPI Backend (100% Free Web Service)
  - type: web
    name: careerforge-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false

  # 2. CareerForge AI - React Frontend (100% Free Static Site)
  - type: web
    name: careerforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE
        value: https://careerforge-backend.onrender.com/api/v1
